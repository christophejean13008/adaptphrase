:root{
  --bg:#e8edf4; --paper:#ffffff; --ink:#1a2330; --muted:#5d6979; --line:#c7d1de;
  --sujet:#1f5fbf; --verbe:#c62828; --cod:#2e7d32; --ccl:#c96400; --adj:#7b3fa0;
  --surligne:#ffe45c; --ok:#2e7d32; --err:#c62828;
  --font:"Andika","Comic Sans MS","Trebuchet MS",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a23; --paper:#1f2733; --ink:#eef2f7; --muted:#a8b3c2; --line:#3a4658;
    --sujet:#7fb0ff; --verbe:#ff7a7a; --cod:#72d27b; --ccl:#ffac5c; --adj:#cfa2f2;
    --surligne:#7a6500; --ok:#72d27b; --err:#ff7a7a;
  }
}
:root[data-theme="dark"]{
  --bg:#141a23; --paper:#1f2733; --ink:#eef2f7; --muted:#a8b3c2; --line:#3a4658;
  --sujet:#7fb0ff; --verbe:#ff7a7a; --cod:#72d27b; --ccl:#ffac5c; --adj:#cfa2f2;
  --surligne:#7a6500; --ok:#72d27b; --err:#ff7a7a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--sujet);outline-offset:3px}

.app{height:100%;display:flex;flex-direction:column;gap:1.4vh;padding:1.4vh 2vw}

/* En-tête */
header{display:flex;align-items:center;gap:1.4vw;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.1rem,1.9vw,1.9rem);font-weight:700;letter-spacing:.01em}
.niveaux{display:flex;gap:.5vw;flex-wrap:wrap}
.niv,.tog{font-size:clamp(1rem,1.6vw,1.6rem);padding:.3em .85em;border-radius:999px;border:2px solid var(--line);background:var(--paper);cursor:pointer}
.niv[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.outils{margin-left:auto;display:flex;gap:.5vw}
.tog{font-size:clamp(.9rem,1.3vw,1.3rem)}
.tog[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}

/* Étape */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.2vh}
.patron{display:flex;align-items:center;gap:.45em;flex-wrap:wrap;font-size:clamp(.9rem,1.3vw,1.3rem)}
.nivlab{color:var(--muted);margin-right:.3em}
.chip{padding:.12em .65em;border-radius:.45em;border:2px solid var(--c);color:var(--c);font-weight:700}
.chip.on{background:var(--c);color:var(--paper)}
h2{margin:.15em 0 0;font-size:clamp(1.4rem,2.9vw,3rem);line-height:1.15}
.aide{display:flex;flex-wrap:wrap;gap:.4em 1.6em;margin:.2em 0 0;font-size:clamp(1rem,1.7vw,1.8rem);color:var(--muted)}
.msg{font-size:clamp(1rem,1.8vw,1.9rem);padding:.35em .8em;border-radius:.5em;background:var(--paper);border-left:.4em solid var(--c,var(--line))}
.msg:empty{display:none}
.msg.err{--c:var(--err);animation:secoue .35s}
.msg.ok{--c:var(--ok)}

.choix{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:1.2vw}
.choix.peu{flex:0 1 40vh;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:minmax(0,1fr)}
.choix.termine{grid-template-columns:1fr;grid-template-rows:1fr}
.cell{position:relative;min-height:0;min-width:0}
.card{width:100%;height:100%;font-size:clamp(1.4rem,3vw,3.3rem);background:var(--paper);border:3px solid var(--line);border-left:1.1rem solid var(--c);border-radius:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12em;padding:.3em;line-height:1.15;cursor:pointer;touch-action:manipulation}
.card:active{transform:scale(.98)}
.peu .card{font-size:clamp(2rem,5vw,5.4rem)}
.card .emo{font-size:1.45em;line-height:1}
.card .sous{font-size:.42em;color:var(--muted)}
.noimg .card .emo{display:none}
.say{position:absolute;top:.45rem;right:.45rem;width:2.8rem;height:2.8rem;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-size:1.25rem;cursor:pointer;display:grid;place-items:center}
.fini{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
.fini .gros{font-size:clamp(1.4rem,2.8vw,2.8rem);padding:.45em 1.2em;border-radius:.7em;border:3px solid var(--ink);background:var(--paper);cursor:pointer}
.fini .gros.fonce{background:var(--ink);color:var(--paper)}

/* Bande de la phrase */
.phrase{background:var(--paper);border:3px solid var(--line);border-radius:1rem;padding:1.4vh 2vw 1.2vh}
.bande{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:.35em;row-gap:.25em;font-size:clamp(1.8rem,4.2vw,4.8rem);min-height:1.8em}
.seg{display:inline-flex;flex-direction:column;align-items:center}
.seg .w{color:var(--c);border-bottom:.06em solid var(--line);padding:0 .08em;white-space:nowrap}
.seg.vide .w{min-width:2.2em;text-align:center;color:var(--muted);border-bottom-style:dashed}
.seg .lab{font-size:.3em;font-weight:700;color:var(--c);visibility:hidden}
.showfun .seg .lab{visibility:visible}
.r-adj{color:var(--adj)}
.fin{background:var(--surligne);border-radius:.12em}
.trou{display:inline-block;width:.75em;height:.85em;margin-left:.05em;border:.06em dashed currentColor;border-radius:.15em;vertical-align:-.08em;animation:clig 1.2s infinite}
.marque{outline:.055em solid var(--ink);outline-offset:.03em;border-radius:.2em;color:var(--ink)}
.actions{display:flex;gap:1vw;flex-wrap:wrap;margin-top:1vh}
.actions button{font-size:clamp(1rem,1.7vw,1.8rem);padding:.3em .9em;border-radius:.6em;border:2px solid var(--line);background:var(--bg);cursor:pointer}
.actions #bLire{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.actions button:disabled{opacity:.4;cursor:default}

/* Plein écran final */
.plein{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;justify-content:center;gap:5vh;padding:calc(env(safe-area-inset-top,0px) + 3vh) 5vw calc(env(safe-area-inset-bottom,0px) + 3vh)}
.plein[hidden]{display:none}
.pl-ligne{text-align:center;line-height:1.35;color:var(--ink)}
.pl-ligne.marelle{font-family:"Marelle",var(--font);line-height:1.7}
.pl-ligne .s{color:var(--c)}
.pl-ligne .marque{outline:none;text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.12em}
.pl-sep{border:0;border-top:3px dashed var(--line);width:60%;margin:0 auto}
.pl-actions{display:flex;justify-content:center;gap:2vw;flex-wrap:wrap}
.pl-actions button,.pf-fermer{font-size:clamp(1.1rem,2vw,2rem);padding:.35em 1em;border-radius:.6em;border:3px solid var(--ink);background:var(--paper);cursor:pointer}
.pl-actions #pLire{background:var(--ink);color:var(--paper)}
.pf-fermer{position:absolute;top:calc(env(safe-area-inset-top,0px) + 1.5vh);right:2vw;font-size:clamp(1rem,1.6vw,1.6rem)}
.plein.nocolor .s{color:var(--ink)}
.pf-couleur{position:absolute;top:calc(env(safe-area-inset-top,0px) + 1.5vh);left:2vw;font-size:clamp(1rem,1.6vw,1.6rem);padding:.35em 1em;border-radius:.6em;border:3px solid var(--line);background:var(--paper);cursor:pointer}
/* Dessins des natures */
.mots{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:0 .3em}
.mot{display:inline-flex;flex-direction:column;align-items:center}
.mot img{display:block;height:.8em;width:auto;margin-top:.05em;pointer-events:none}
.card .mot img{height:.75em}
.w.nat,.s.nat{display:inline-flex;align-items:flex-start;gap:0 .3em}
.pl-ligne .s.nat{vertical-align:top}
.nat .pt{margin-left:-.3em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mot img{filter:invert(1)}}
:root[data-theme="dark"] .mot img{filter:invert(1)}
@keyframes clig{50%{opacity:.25}}
@keyframes secoue{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){.trou,.msg.err{animation:none}}
@media (max-aspect-ratio:1/1){
  .choix{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}
  .outils{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Adaptphrase</h1>
    <nav class="niveaux" id="niveaux" aria-label="Choisir le niveau"></nav>
    <div class="outils">
      <button class="tog" id="bTirage">🎲 Nouveaux mots</button>
      <button class="tog" id="tNat" aria-pressed="true">Natures</button>
      <button class="tog" id="tFun" aria-pressed="false">Fonctions</button>
      <button class="tog" id="tImg" aria-pressed="true">Images</button>
    </div>
  </header>

  <main class="stage">
    <div>
      <div class="patron" id="patron"></div>
      <h2 id="titre"></h2>
      <div class="aide" id="aide"></div>
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="choix" id="choix"></div>
  </main>

  <section class="phrase" aria-label="Ma phrase">
    <div class="bande" id="bande"></div>
    <div class="actions">
      <button id="bLire">🔊 Lire la phrase</button>
      <button id="bAnnul">↩ Annuler</button>
      <button id="bNouv">Nouvelle phrase</button>
    </div>
  </section>
</div>

<div class="plein" id="plein" hidden role="dialog" aria-label="Ma phrase en grand">
  <button class="pf-couleur" id="pCoul" aria-pressed="true">Couleurs</button>
  <button class="pf-fermer" id="pFermer">✕ Fermer</button>
  <div class="pl-ligne" id="pA"></div>
  <hr class="pl-sep">
  <div class="pl-ligne marelle" id="pM"></div>
  <div class="pl-actions">
    <button id="pLire">🔊 Lire la phrase</button>
    <button id="pNouv">Nouvelle phrase</button>
  </div>
</div>

  {n:'fromage',g:'m',end:'s',e:'🧀'},{n:'gâteau',g:'m',end:'x',e:'🎂'},{n:'cadeau',g:'m',end:'x',e:'🎁'},
  {n:'chapeau',g:'m',end:'x',e:'🎩'},{n:'bateau',g:'m',end:'x',e:'⛵'},{n:'bonbon',g:'m',end:'s',e:'🍬'},
  {n:'bouquet',g:'m',end:'s',e:'💐'},{n:'parapluie',g:'m',end:'s',e:'☂️'},{n:'tambour',g:'m',end:'s',e:'🥁'},
  {n:'crayon',g:'m',end:'s',e:'✏️'},{n:'cahier',g:'m',end:'s',e:'📓'},
  {n:'pomme',g:'f',end:'s',e:'🍎'},{n:'fleur',g:'f',end:'s',e:'🌸'},{n:'couronne',g:'f',end:'s',e:'👑'},
  {n:'carotte',g:'f',end:'s',e:'🥕'},{n:'banane',g:'f',end:'s',e:'🍌'},{n:'lettre',g:'f',end:'s',e:'✉️'},
  {n:'clé',g:'f',end:'s',e:'🔑'},{n:'glace',g:'f',end:'s',e:'🍦'},{n:'tarte',g:'f',end:'s',e:'🥧'},
  {n:'pizza',g:'f',end:'s',e:'🍕'},{n:'guitare',g:'f',end:'s',e:'🎸'},{n:'montre',g:'f',end:'s',e:'⌚'},
  {n:'fusée',g:'f',end:'s',e:'🚀'},{n:'chaussette',g:'f',end:'s',e:'🧦'}
];
const POOL_ADJ=[
  {a:'petit',pos:'av',e:'🐭'},{a:'grand',pos:'av',e:'🗼'},{a:'joli',pos:'av',e:'🌈'},
  {a:'méchant',pos:'ap',e:'😠'},{a:'vert',pos:'ap',e:'🟢'},{a:'noir',pos:'ap',e:'⚫'},
  {a:'bleu',pos:'ap',e:'🔵'},{a:'content',pos:'ap',e:'😊'},{a:'fort',pos:'ap',e:'💪'},
  {a:'blond',pos:'ap',e:'👱'},{a:'rond',pos:'ap',e:'⚪'},{a:'brillant',pos:'ap',e:'✨'},
  {a:'amusant',pos:'ap',e:'🤪'},{a:'gourmand',pos:'ap',e:'🤤'},{a:'poilu',pos:'ap',e:'🦍'},
  {a:'pointu',pos:'ap',e:'📐'},{a:'froid',pos:'ap',e:'🥶'},{a:'lourd',pos:'ap',e:'🏋️'}
];

function melange(arr,k){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return k?a.slice(0,k):a;}
let M={};
function tirage(){
  M.suj=melange([...melange(POOL_SUJ.filter(s=>s.g==='m'),3),...melange(POOL_SUJ.filter(s=>s.g==='f'),3)]);
  M.vi=melange(POOL_VI,6); M.vt=melange(POOL_VT,6);
  M.ccl=melange(POOL_CCL,6); M.adj=melange(POOL_ADJ,6);
  const obj=melange([...melange(POOL_OBJ.filter(o=>o.g==='m'),3),...melange(POOL_OBJ.filter(o=>o.g==='f'),3)]);
  const pl=new Set(melange([0,1,2,3,4,5],2));
  M.obj=obj.map((o,i)=>({...o,d:pl.has(i)?'les':(o.g==='m'?'le':'la')}));
}

const ROLES={
  sujet:{lab:'sujet',q:'Qui ?',c:'--sujet'},
  verbe:{lab:'verbe',q:'Fait quoi ?',c:'--verbe'},
  cod:{lab:'COD',q:'Quoi ?',c:'--cod'},
  ccl:{lab:'CC de lieu',q:'Où ?',c:'--ccl'},
  adj:{lab:'adjectif',q:'Comment ?',c:'--adj'}
};
const SUJ=['nom','det','finNom','verbe','finVerbe'];
const NIVEAUX={
  1:{steps:['gn','verbe','ccl'],vt:false,pat:['sujet','verbe','ccl']},
  2:{steps:[...SUJ,'ccl'],vt:false,pat:['sujet','verbe','ccl']},
  3:{steps:[...SUJ,'cod'],vt:true,pat:['sujet','verbe','cod']},
  4:{steps:[...SUJ,'cod','ccl'],vt:true,pat:['sujet','verbe','cod','ccl']},
  5:{steps:[...SUJ,'codNom','codDet','finCod'],vt:true,pat:['sujet','verbe','cod']},
  6:{steps:[...SUJ,'cod','ccl','adj','adjPlace','finAdj'],vt:true,pat:['sujet','verbe','cod','ccl'],adj:true}
};
const ROLE_ETAPE={gn:'sujet',nom:'sujet',det:'sujet',finNom:'sujet',verbe:'verbe',finVerbe:'verbe',cod:'cod',codNom:'cod',codDet:'cod',finCod:'cod',ccl:'ccl',adj:'adj',adjPlace:'adj',finAdj:'adj'};

/* ---------- État ---------- */
let niveau=1, S=neuf(), hist=[], msg=null, voirFonctions=false, voirImages=true, voirNatures=true;
function neuf(){return{noun:null,det:null,nounEnd:false,verb:null,verbEnd:false,cod:null,codDet:null,codEnd:false,ccl:null,adj:null,adjTarget:null,adjEnd:null};}
const pluriel=()=>S.det==='les';
const codPl=()=>S.codDet==='les';
function applicable(st){
  if(st==='finNom'||st==='finVerbe')return pluriel();
  if(st==='finCod')return codPl();
  return true;
}
function fait(st){
  switch(st){
    case 'gn':case 'nom':return !!S.noun;
    case 'det':return !!S.det;
    case 'finNom':return S.nounEnd;
    case 'verbe':return !!S.verb;
    case 'finVerbe':return S.verbEnd;
    case 'cod':case 'codNom':return !!S.cod;
    case 'codDet':return !!S.codDet;
    case 'finCod':return S.codEnd;
    case 'ccl':return !!S.ccl;
    case 'adj':return !!S.adj;
    case 'adjPlace':return !!S.adjTarget;
    case 'finAdj':return S.adjEnd!==null;
  }
}
function etape(){for(const st of NIVEAUX[niveau].steps){if(applicable(st)&&!fait(st))return st;}return null;}

/* ---------- Voix ---------- */
let voix=null;
function chargeVoix(){
  const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('fr'));
  voix=v.find(x=>/fr[-_]FR/i.test(x.lang))||v[0]||null;
}
if('speechSynthesis' in window){chargeVoix();speechSynthesis.onvoiceschanged=chargeVoix;}
function dire(t){
  if(!('speechSynthesis' in window)||!t)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang='fr-FR'; if(voix)u.voice=voix; u.rate=.85;
  speechSynthesis.speak(u);
}

/* ---------- Construction du texte ---------- */
function mk(html,nat){return{
  H:html,
  fin:x=>html?`<span class="fin">${x}</span>`:x,
  trou:()=>html?'<span class="trou"></span>':'',
  adj:x=>html?`<span class="r-adj">${x}</span>`:x,
  mot:(x,k)=>(html&&nat&&k&&x)?`<span class="mot"><span class="t">${x}</span><img src="${IMG[k]}" alt="${NAT_LAB[k]}"></span>`:x
};}
function motAdj(b){return S.adj.a+(S.adjEnd===null?b.trou():(S.adjEnd?b.fin(S.adjEnd):''));}
function groupe(b,det,nom,cible){
  const a=(S.adj&&S.adjTarget===cible)?b.adj(b.mot(motAdj(b),'A')):'';
  const p=[b.mot(det,'D')];
  if(a&&S.adj.pos==='av')p.push(a);
  p.push(b.mot(nom,'N'));
  if(a&&S.adj.pos==='ap')p.push(a);
  return p.filter(Boolean).join(' ');
}
function txtSujet(b,maj){
  if(!S.noun)return null;
  let det=S.det||b.trou();
  if(maj&&S.det){
    det=S.det[0].toUpperCase()+S.det.slice(1);
    if(b.H&&maj==='marque')det=`<span class="marque">${det[0]}</span>${det.slice(1)}`;
  }
  let n=S.noun.n;
  if(pluriel())n+=S.nounEnd?b.fin(S.noun.end):b.trou();
  return groupe(b,det,n,'sujet');
}
function txtVerbe(b){if(!S.verb)return null;return b.mot(S.verb.v+(pluriel()?(S.verbEnd?b.fin('nt'):b.trou()):''),'V');}
function txtCod(b){
  if(!S.cod)return null;
  let n=S.cod.n;
  if(codPl())n+=S.codEnd?b.fin(S.cod.end):b.trou();
  return groupe(b,S.codDet||b.trou(),n,'cod');
}
function txtCcl(b){return S.ccl?[S.ccl.p,b.mot(S.ccl.d,'D'),b.mot(S.ccl.n,'N')].join(' '):null;}
const GET={sujet:txtSujet,verbe:txtVerbe,cod:txtCod,ccl:txtCcl};
function phraseTexte(){
  const b=mk(false);
  const parts=NIVEAUX[niveau].pat.map(r=>GET[r](b,true)).filter(Boolean);
  if(!parts.length)return '';
  return parts.join(' ')+(etape()===null?'.':'');
}

/* ---------- Actions ---------- */
function maj(fn,m){hist.push(JSON.stringify(S));fn();msg=m||null;rendu();if(etape()===null){ouvrePlein();setTimeout(()=>dire(phraseTexte()),350);}}
function phraseHTML(nat){
  const b=mk(true,nat), pat=NIVEAUX[niveau].pat;
  return pat.map((r,i)=>`<span class="s${nat?' nat':''}" style="--c:var(${ROLES[r].c})">${GET[r](b,'marque')}${i===pat.length-1?'<span class="marque pt">.</span>':''}</span>`).join(' ');
}
function ouvrePlein(){
  const n=phraseTexte().length;
  const taille=Math.min(8,160/n);
  $('pA').innerHTML=phraseHTML(voirNatures); $('pA').style.fontSize=taille+'vw';
  $('pM').innerHTML=phraseHTML(false); $('pM').style.fontSize=(taille*1.05)+'vw';
  $('plein').hidden=false;
  try{const d=document.documentElement;if(d.requestFullscreen&&!document.fullscreenElement)d.requestFullscreen().catch(()=>{});}catch(e){}
}
function fermePlein(){
  $('plein').hidden=true;
  try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
}
function erreur(x){msg={t:'err',x};rendu();}
function nouvelle(){fermePlein();S=neuf();hist=[];msg=null;rendu();}
function annuler(){if(!hist.length)return;S=JSON.parse(hist.pop());msg=null;rendu();}
function changeNiveau(k){niveau=k;nouvelle();}

function detFaux(d,nom){
  if(d==='les'||(d==='le')===(nom.g==='m'))return null;
  return `« ${d} ${nom.n} » ne va pas : ${nom.n} est ${nom.g==='m'?'masculin, on dit « le »':'féminin, on dit « la »'}.`;
}
function finFaux(f,nom){
  if(f===nom.end)return null;
  if(nom.end==='x')return /eau$/.test(nom.n)?'Non : les noms en « eau » prennent un x.':`Non : « ${nom.n} » prend un x au pluriel.`;
  return `Non : pour « ${nom.n} », on n'ajoute pas un x.`;
}

/* ---------- Rendu ---------- */
const $=id=>document.getElementById(id);

function carte(o,role){
  const cell=document.createElement('div');cell.className='cell';
  const bt=document.createElement('button');bt.className='card';
  bt.style.setProperty('--c',`var(${ROLES[o.r||role].c})`);
  bt.innerHTML=(o.e?`<span class="emo" aria-hidden="true">${o.e}</span>`:'')+`<span class="mots">${o.h}</span>`+(o.sous?`<span class="sous">${o.sous}</span>`:'');
  bt.onclick=()=>{if(o.dit)dire(o.dit);o.go();};
  cell.appendChild(bt);
  if(o.dit){
    const s=document.createElement('button');s.className='say';s.textContent='🔊';
    s.setAttribute('aria-label','Écouter : '+o.dit);
    s.onclick=e=>{e.stopPropagation();dire(o.dit);};
    cell.appendChild(s);
  }
  return cell;
}

function choixNom(liste,poser){return liste.map(s=>({h:B.mot(s.n,'N'),e:s.e,dit:s.n,go:()=>maj(()=>poser(s))}));}
function choixDet(nom,poser){return ['le','la','les'].map(d=>({h:B.mot(d,'D'),go:()=>{const f=detFaux(d,nom);if(f)erreur(f);else maj(()=>poser(d));}}));}
function choixFin(nom,poser){return ['s','x'].map(f=>({h:B.mot(`${nom.n}<span class="fin">${f}</span>`,'N'),sous:`+ ${f}`,go:()=>{const e=finFaux(f,nom);if(e)erreur(e);else maj(()=>poser(),{t:'ok',x:`Oui ! les ${nom.n}${f}`});}}));}
const B=mk(true,true);

function rendEtape(){
  const st=etape(), N=NIVEAUX[niveau], role=st?ROLE_ETAPE[st]:null;
  const chips=[...N.pat,...(N.adj?['adj']:[])];
  $('patron').innerHTML=`<span class="nivlab">Niveau ${niveau}</span>`+chips.map(r=>`<span class="chip${r===role?' on':''}" style="--c:var(${ROLES[r].c})">${ROLES[r].q}</span>`).join('');
  const m=$('msg');m.className='msg'+(msg?' '+msg.t:'');m.textContent=msg?msg.x:'';
  if(msg&&msg.t==='err'){m.style.animation='none';void m.offsetWidth;m.style.animation='';}

  const b=mk(false);
  const aideDet=['le : un seul (masculin)','la : une seule (féminin)','les : plusieurs'];
  const aideFin=['Il y en a plusieurs : on ajoute s ou x à la fin du nom.'];
  let titre='',aide=[],opts=[],peu=false;
  switch(st){
    case 'gn':
      titre='Qui ? Choisis le sujet de ta phrase.';
      opts=M.suj.map(s=>{const d=s.g==='m'?'le':'la';return{h:`${B.mot(d,'D')} ${B.mot(s.n,'N')}`,e:s.e,dit:`${d} ${s.n}`,go:()=>maj(()=>{S.noun=s;S.det=d;})};});
      break;
    case 'nom':
      titre='Qui ? Choisis un nom.';
      opts=choixNom(M.suj,s=>{S.noun=s;});
      break;
    case 'det':
      titre=`Choisis le déterminant pour « ${S.noun.n} ».`; aide=aideDet; peu=true;
      opts=choixDet(S.noun,d=>{S.det=d;});
      break;
    case 'finNom':
      titre='Attention : avec « les », la fin du nom change !'; aide=aideFin; peu=true;
      opts=choixFin(S.noun,()=>{S.nounEnd=true;});
      break;
    case 'verbe':{
      const s=txtSujet(b,false);
      titre=pluriel()?`Que font ${s} ?`:`Que fait ${s} ?`;
      opts=(N.vt?M.vt:M.vi).map(v=>({h:B.mot(v.v,'V'),e:v.e,dit:v.v,go:()=>maj(()=>{S.verb=v;})}));
      break;}
    case 'finVerbe':
      titre='Attention : la fin du verbe change aussi !';
      aide=['Ils sont plusieurs : quelle est la bonne fin du verbe ?'];
      peu=true;
      opts=['s','nt'].map(f=>({h:B.mot(`${S.verb.v}<span class="fin">${f}</span>`,'V'),sous:`+ ${f}`,go:()=>{
        if(f==='nt')maj(()=>{S.verbEnd=true;},{t:'ok',x:`Oui ! ils ${S.verb.v}nt : on n'entend pas « nt », mais on l'écrit.`});
        else erreur('Non : le s, c\'est pour les noms. Le verbe prend une autre fin.');
      }}));
      break;
    case 'cod':
      titre=`${txtSujet(b,true)} ${txtVerbe(b)} quoi ?`;
      opts=M.obj.map(o=>{const p=o.d==='les';return{h:`${B.mot(o.d,'D')} ${B.mot(o.n+(p?`<span class="fin">${o.end}</span>`:''),'N')}`,e:o.e,dit:`${o.d} ${o.n}${p?o.end:''}`,go:()=>maj(()=>{S.cod=o;S.codDet=o.d;S.codEnd=true;})};});
      break;
    case 'codNom':
      titre=`${txtSujet(b,true)} ${txtVerbe(b)} quoi ?`;
      aide=['Choisis un nom : il sera le COD.'];
      opts=choixNom(M.obj,o=>{S.cod=o;});
      break;
    case 'codDet':
      titre=`Choisis le déterminant pour « ${S.cod.n} ».`; aide=aideDet; peu=true;
      opts=choixDet(S.cod,d=>{S.codDet=d;});
      break;
    case 'finCod':
      titre='Attention : avec « les », la fin du nom change !'; aide=aideFin; peu=true;
      opts=choixFin(S.cod,()=>{S.codEnd=true;});
      break;
    case 'ccl':
      titre='Où ? Choisis un lieu.';
      opts=M.ccl.map(c=>({h:`${c.p} ${B.mot(c.d,'D')} ${B.mot(c.n,'N')}`,e:c.e,dit:`${c.p} ${c.d} ${c.n}`,go:()=>maj(()=>{S.ccl=c;})}));
      break;
    case 'adj':
      titre='Comment ? Choisis un adjectif pour décrire.';
      aide=['Ensuite, tu le mettras dans le sujet ou dans le COD.'];
      opts=M.adj.map(a=>({h:B.mot(a.a,'A'),e:a.e,dit:a.a,go:()=>maj(()=>{S.adj=a;})}));
      break;
    case 'adjPlace':{
      titre=`Où mets-tu « ${S.adj.a} » ?`;
      peu=true;
      const avant=S.adjTarget;
      S.adjTarget='sujet'; const pS=txtSujet(B,false);
      S.adjTarget='cod'; const pC=txtCod(B);
      S.adjTarget=avant;
      opts=[
        {r:'sujet',h:pS,sous:'dans le sujet',go:()=>maj(()=>{S.adjTarget='sujet';})},
        {r:'cod',h:pC,sous:'dans le COD',go:()=>maj(()=>{S.adjTarget='cod';})}
      ];
      break;}
    case 'finAdj':{
      const sj=S.adjTarget==='sujet';
      const fem=sj?S.noun.g==='f':S.cod.g==='f';
      const pl=sj?pluriel():codPl();
      const nom=sj?S.noun.n+(pl?S.noun.end:''):S.cod.n+(pl?S.cod.end:'');
      const attendu=(fem?'e':'')+(pl?'s':'');
      titre=`L'adjectif s'accorde avec « ${nom} ».`;
      aide=['féminin : on ajoute e','pluriel : on ajoute s'];
      peu=true;
      opts=['','e','s','es'].map(f=>({h:B.mot(S.adj.a+(f?`<span class="fin">${f}</span>`:''),'A'),sous:f?`+ ${f}`:'rien',go:()=>{
        if(f===attendu)maj(()=>{S.adjEnd=f;},{t:'ok',x:`Oui ! « ${nom} » est ${fem?'féminin':'masculin'} et ${pl?'pluriel':'singulier'}.`});
        else erreur(`Non : « ${nom} » est ${fem?'féminin':'masculin'} et ${pl?'pluriel (plusieurs)':'singulier (un seul)'}.`);
      }}));
      break;}
    case null:
      titre='Ta phrase est terminée !';
      aide=['Relis-la.','Vérifie la majuscule au début et le point à la fin.','Puis recopie-la.'];
      break;
  }

  $('titre').textContent=titre;
  $('aide').innerHTML=aide.map(a=>`<span>${a}</span>`).join('');
  const C=$('choix');C.innerHTML='';
  if(st===null){
    C.className='choix termine';
    const f=document.createElement('div');f.className='fini';
    f.innerHTML='<button class="gros fonce" id="fGrand">⛶ Afficher en grand</button><button class="gros" id="fLire">🔊 Lire la phrase</button><button class="gros" id="fNouv">Nouvelle phrase</button>';
    C.appendChild(f);
    $('fGrand').onclick=ouvrePlein;
    $('fLire').onclick=()=>dire(phraseTexte());
    $('fNouv').onclick=nouvelle;
  }else{
    C.className='choix'+(peu?' peu':'');
    C.style.setProperty('--n',opts.length);
    opts.forEach(o=>C.appendChild(carte(o,role)));
  }
}

function rendBande(){
  const b=mk(true,voirNatures), fini=etape()===null, pat=NIVEAUX[niveau].pat;
  $('bande').innerHTML=pat.map((r,i)=>{
    let t=GET[r](b,fini?'marque':true);
    const vide=t===null; if(vide)t='…';
    if(fini&&i===pat.length-1)t+='<span class="marque pt">.</span>';
    return `<span class="seg${vide?' vide':''}" style="--c:var(${ROLES[r].c})"><span class="w${voirNatures&&!vide?' nat':''}">${t}</span><span class="lab">${ROLES[r].lab}</span></span>`;
  }).join('');
  $('bLire').disabled=!phraseTexte();
  $('bAnnul').disabled=!hist.length;
}

function rendNiveaux(){
  const nav=$('niveaux');nav.innerHTML='';
  Object.keys(NIVEAUX).forEach(k=>{
    const bt=document.createElement('button');bt.className='niv';
    bt.textContent='Niveau '+k;bt.setAttribute('aria-pressed',String(+k===niveau));
    bt.onclick=()=>changeNiveau(+k);nav.appendChild(bt);
  });
}

function rendu(){
  document.body.classList.toggle('showfun',voirFonctions);
  document.body.classList.toggle('noimg',!voirImages);
  $('tFun').setAttribute('aria-pressed',String(voirFonctions));
  $('tImg').setAttribute('aria-pressed',String(voirImages));
  $('tNat').setAttribute('aria-pressed',String(voirNatures));
  rendNiveaux();rendEtape();rendBande();
}

$('tFun').onclick=()=>{voirFonctions=!voirFonctions;rendu();};
$('tImg').onclick=()=>{voirImages=!voirImages;rendu();};
$('tNat').onclick=()=>{voirNatures=!voirNatures;rendu();};
$('bTirage').onclick=()=>{tirage();nouvelle();};
$('bLire').onclick=()=>dire(phraseTexte());
$('bAnnul').onclick=annuler;
$('bNouv').onclick=nouvelle;
$('pFermer').onclick=fermePlein;
$('pLire').onclick=()=>dire(phraseTexte());
$('pNouv').onclick=nouvelle;
$('pCoul').onclick=()=>{const p=$('plein');const c=p.classList.toggle('nocolor');$('pCoul').setAttribute('aria-pressed',String(!c));};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('plein').hidden)fermePlein();});
tirage();
rendu();
</script>
